<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>수원도시공사 민원 답변 초안기</title>
    <style>
:root {
  --bg: #eef2f5;
  --panel: #ffffff;
  --ink: #17202a;
  --muted: #637083;
  --line: #d8e0e7;
  --brand: #225ea8;
  --brand-dark: #17477f;
  --accent: #2f7d6d;
  --soft: #f6f8fa;
  --warning: #8b5e00;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
}

button,
input,
select,
textarea {
  font: inherit;
}

.app-shell {
  width: min(1440px, 100%);
  margin: 0 auto;
  padding: 28px;
}

.workspace {
  background: var(--panel);
  border: 1px solid var(--line);
  min-height: calc(100vh - 56px);
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 24px 28px;
  border-bottom: 1px solid var(--line);
}

.brand-block {
  display: flex;
  align-items: center;
  gap: 18px;
  flex: 1;
  min-width: 0;
}

.brand-logo {
  width: min(280px, 30vw);
  height: auto;
  flex: 0 1 auto;
  object-fit: contain;
}

.title-block {
  flex: 1;
  text-align: center;
  min-width: 0;
}

h1,
h2,
h3 {
  margin: 0;
}

h1 {
  font-size: clamp(34px, 4vw, 54px);
  font-weight: 800;
  letter-spacing: 0;
  line-height: 1.12;
}

h2 {
  font-size: 18px;
}

h3 {
  font-size: 16px;
}

.editor-grid {
  display: grid;
  grid-template-columns: minmax(360px, 0.95fr) minmax(420px, 1.05fr);
  gap: 0;
}

.panel {
  padding: 24px 28px;
}

.input-panel {
  border-right: 1px solid var(--line);
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.section-title span {
  color: var(--muted);
  font-size: 13px;
}

label {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
  color: #2f3b47;
  font-size: 14px;
  font-weight: 700;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  padding: 11px 12px;
  outline: none;
}

textarea {
  resize: vertical;
  line-height: 1.55;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(34, 94, 168, 0.12);
}

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.switch-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 6px 0 18px;
}

.checkbox-label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  min-height: 38px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--soft);
  font-weight: 600;
}

.checkbox-label input {
  width: 16px;
  height: 16px;
}

.primary-button,
.secondary-button,
.ghost-button,
.copy-button {
  border: 1px solid transparent;
  border-radius: 6px;
  min-height: 40px;
  padding: 0 16px;
  cursor: pointer;
  font-weight: 700;
}

.primary-button {
  width: 100%;
  background: var(--brand);
  color: #fff;
}

.secondary-button {
  width: 100%;
  margin-bottom: 10px;
  background: #fff;
  border-color: var(--brand);
  color: var(--brand-dark);
}

.primary-button:hover {
  background: var(--brand-dark);
}

.secondary-button:hover {
  background: #f1f6fb;
}

.ghost-button,
.copy-button {
  background: #fff;
  border-color: var(--line);
  color: var(--brand-dark);
}

.ghost-button:hover,
.copy-button:hover {
  background: var(--soft);
}

.draft-box {
  min-height: 520px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fbfcfd;
  padding: 20px;
  white-space: pre-wrap;
  line-height: 1.75;
  color: #1d2733;
}

.draft-box:empty::before {
  content: "왼쪽 항목을 입력한 뒤 초안 생성을 누르면 답변문이 표시됩니다.";
  color: var(--muted);
}

.review-box {
  margin-top: 18px;
  border: 1px solid #eadfbd;
  border-radius: 6px;
  background: #fffaf0;
  padding: 16px;
}

.review-box h3 {
  color: var(--warning);
  margin-bottom: 10px;
}

.review-box ul {
  margin: 0;
  padding-left: 18px;
  color: #3b4148;
  line-height: 1.6;
}

@media (max-width: 920px) {
  .app-shell {
    padding: 12px;
  }

  .workspace {
    min-height: calc(100vh - 24px);
  }

  .topbar {
    align-items: flex-start;
    flex-direction: column;
    padding: 20px;
  }

  .brand-block {
    width: 100%;
    align-items: center;
    flex-direction: column;
    gap: 12px;
  }

  .brand-logo {
    width: min(280px, 100%);
  }

  .title-block {
    width: 100%;
    text-align: center;
  }

  .editor-grid,
  .field-row {
    grid-template-columns: 1fr;
  }

  .input-panel {
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .panel {
    padding: 20px;
  }

  .draft-box {
    min-height: 360px;
  }
}

</style>

    <script>
const form = document.querySelector("#complaintForm");
const draftOutput = document.querySelector("#draftOutput");
const reviewList = document.querySelector("#reviewList");
const copyButton = document.querySelector("#copyButton");
const resetButton = document.querySelector("#resetButton");
const sampleButton = document.querySelector("#sampleButton");

const categoryLabels = {
  facility: "시설물 관리",
  hygiene: "위생 및 환경 관리",
  operation: "운영 및 이용 안내",
  parking: "주차 및 교통 관리",
  staff: "직원 응대",
  safety: "안전 관리",
  other: "해당 민원",
};

const toneOpenings = {
  balanced: "귀하께서 문의하신 사항에 대하여 아래와 같이 답변드립니다.",
  firm: "귀하께서 제기하신 사항에 대해 관련 내용을 확인하여 다음과 같이 안내드립니다.",
  warm: "귀하께서 이용 과정에서 느끼신 불편 사항에 대해 관련 내용을 확인하여 아래와 같이 안내드립니다.",
};

const riskyPhrases = [
  "진심으로 사과",
  "전적으로",
  "명백한 잘못",
  "책임을 통감",
  "과실",
  "배상",
  "보상하겠습니다",
  "잘못을 인정",
];

function valueOf(id) {
  return document.querySelector(`#${id}`).value.trim();
}

function normalizeText(text) {
  return text
    .split("\n")
    .map((line) => line.trim())
    .filter(Boolean)
    .join("\n");
}

function paragraphOrFallback(text, fallback) {
  const normalized = normalizeText(text);
  return normalized || fallback;
}

function splitItems(text) {
  return normalizeText(text)
    .split(/\n|[;；]/)
    .map((item) => item.replace(/^[\s\-*ㆍ·]+/, "").trim())
    .filter(Boolean);
}

function trimEnding(text) {
  return text.replace(/[.。!?！？\s]+$/g, "").trim();
}

function actionStem(text) {
  return trimEnding(text)
    .replace(/(할 예정입니다|할 예정임|예정입니다|예정임)$/g, "")
    .replace(/(하였습니다|했습니다|합니다|중입니다|입니다)$/g, "")
    .trim();
}

function refineSummary(text, category) {
  const items = splitItems(text);
  if (!items.length) {
    return `귀하께서 제기하신 ${category} 관련 사항은 시설 이용 과정에서의 불편 및 개선 요청으로 이해하였습니다.`;
  }

  const body = items.map(trimEnding).join(", ");
  return `귀하께서는 ${body}에 대한 확인과 개선을 요청하신 것으로 이해하였습니다.`;
}

function refineActions(text) {
  const items = splitItems(text);
  if (!items.length) {
    return "우리 공사에서는 접수된 내용을 바탕으로 필요한 조치 사항을 검토하고, 이용 불편을 줄일 수 있도록 관리에 유의하겠습니다.";
  }

  if (items.length === 1) {
    return `우리 공사에서는 ${actionStem(items[0])} 등 필요한 조치를 검토하여 추진하겠습니다.`;
  }

  const sentences = items.map((item, index) => {
    const ending = index === items.length - 1 ? "추진하겠습니다" : "검토하겠습니다";
    return `${index + 1}. ${actionStem(item)} 사항을 ${ending}.`;
  });

  return sentences.join("\n");
}

function makeDraft(data) {
  const category = categoryLabels[data.category] || categoryLabels.other;
  const titleLine = data.title ? `제목: ${data.title}\n\n` : "";
  const department = data.department || "담당 부서";
  const phone = data.phone || "담당 부서 연락처";

  const summary = refineSummary(data.summary, category);
  const actions = refineActions(data.actions);

  const deadlineText = data.includeDeadline
    ? "\n\n처리기한 내 검토가 필요한 사항은 관계 부서 확인을 거쳐 순차적으로 조치하겠습니다."
    : "";
  const closingText = data.includeClosing
    ? "\n\n앞으로도 이용 환경 개선과 안정적인 시설 운영을 위해 지속적으로 관리하겠습니다."
    : "";

  return `${titleLine}고객님 안녕하세요.
수원도시공사 ${department}입니다.

먼저 우리 공사 시설과 운영에 관심을 가지고 의견을 주셔서 감사드립니다.
${toneOpenings[data.tone]}

귀하의 민원 요지는 다음과 같이 이해하였습니다.
${summary}

이에 따라 우리 공사에서는 다음과 같이 조치하였거나 조치할 예정입니다.
${actions}${deadlineText}${closingText}

추가로 궁금하신 사항은 수원도시공사 ${department}(${phone})로 문의하여 주시면 성실히 안내드리겠습니다.

감사합니다.`;
}

function reviewDraft(text, data) {
  const messages = [
    "과실을 단정하는 표현 대신 '확인한 내용', '조치할 예정', '관리하겠습니다' 중심으로 작성되었습니다.",
    "입력한 민원 요지와 조치 내용은 답변 문장에 맞게 정리되어 반영됩니다.",
  ];

  const foundRisk = riskyPhrases.filter((phrase) => text.includes(phrase));
  if (foundRisk.length) {
    messages.unshift(`주의 표현 확인: ${foundRisk.join(", ")}`);
  }

  if (!data.actions) {
    messages.push("조치 일자, 예정 시기, 담당 범위를 넣으면 민원인이 이해하기 쉽습니다.");
  }

  if (!data.phone) {
    messages.push("문의처를 실제 담당 연락처로 교체해 주세요.");
  }

  reviewList.innerHTML = messages.map((message) => `<li>${message}</li>`).join("");
}

form.addEventListener("submit", (event) => {
  event.preventDefault();

  const data = {
    title: valueOf("title"),
    department: valueOf("department"),
    phone: valueOf("phone"),
    category: valueOf("category"),
    tone: valueOf("tone"),
    summary: valueOf("summary"),
    actions: valueOf("actions"),
    includeDeadline: document.querySelector("#includeDeadline").checked,
    includeClosing: document.querySelector("#includeClosing").checked,
  };

  const draft = makeDraft(data);
  draftOutput.textContent = draft;
  reviewDraft(draft, data);
});

copyButton.addEventListener("click", async () => {
  const text = draftOutput.textContent.trim();
  if (!text) return;
  await navigator.clipboard.writeText(text);
  copyButton.textContent = "복사됨";
  setTimeout(() => {
    copyButton.textContent = "복사";
  }, 1400);
});

resetButton.addEventListener("click", () => {
  form.reset();
  draftOutput.textContent = "";
  reviewList.innerHTML = "";
});

sampleButton.addEventListener("click", () => {
  document.querySelector("#title").value = "장안구민회관 수영장 타일 위생 관련";

    "수영장 바닥 타일의 오염 및 변색으로 인해 위생 상태 개선을 요청하신 내용으로 이해하였습니다.";
  document.querySelector("#actions").value =

  form.requestSubmit();
});
